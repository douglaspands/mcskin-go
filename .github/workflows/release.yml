name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run Tests
        run: go test -v ./...

      - name: Build and Package Release Assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.version=${TAG} -X main.commit=${GITHUB_SHA} -X main.date=${BUILD_DATE}"

          mkdir -p dist build-linux build-windows build-darwin

          # Generate icon assets if needed
          go run scripts/gen-icons.go

          # Build Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o build-linux/mcskin ./cmd/mcskin
          cp README.md build-linux/
          tar -czf "dist/mcskin_${TAG}_linux_amd64.tar.gz" -C build-linux mcskin README.md

          # Build Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o build-windows/mcskin.exe ./cmd/mcskin
          cp README.md build-windows/
          (cd build-windows && zip "../dist/mcskin_${TAG}_windows_amd64.zip" mcskin.exe README.md)

          # Build macOS arm64 and package mcskin.app bundle
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o build-darwin/mcskin ./cmd/mcskin
          chmod +x scripts/package-mac-app.sh
          ./scripts/package-mac-app.sh build-darwin/mcskin build-darwin
          cp README.md build-darwin/
          (cd build-darwin && zip -r "../dist/mcskin_${TAG}_darwin_arm64.zip" mcskin.app mcskin README.md)

          # Generate SHA256 Checksums
          (cd dist && sha256sum mcskin_${TAG}_linux_amd64.tar.gz mcskin_${TAG}_windows_amd64.zip mcskin_${TAG}_darwin_arm64.zip > checksums.txt)

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
