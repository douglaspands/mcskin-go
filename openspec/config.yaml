schema: spec-driven

context: |
  Project: mcskin (Minecraft Bedrock Skin Pack Converter)
  Language & Toolchain: Go 1.25+, standard library only (image/png, archive/zip, crypto/rand, encoding/json, path/filepath). Zero third-party runtime dependencies in the production binary and served frontend; development/test tooling (e.g. a devDependency-only package.json for browser-driven regression testing) may declare external dependencies when they meaningfully improve quality, provided they are never bundled into the binary or served static assets.
  Platform Compatibility: Cross-platform (Linux and Windows amd64). Use filepath.ToSlash() for zip entries.
  Domain & Standards:
    - Minecraft Bedrock .mcpack format: zip archive containing manifest.json (format_version: 2, RFC-4122 UUIDv4 header & module), skins.json, texts/en_US.lang, and texture.png.
    - Skin models: classic (geometry.humanoid.custom, 4px arms) and slim (geometry.humanoid.customSlim, 3px arms).
    - Image validation: 64x64 or 128x128 RGBA PNG only.
    - Output location: Exact same directory as input PNG with matching basename and .mcpack extension.
  AI Agent Governance, TDD Methodology, Host Security, and Git Conventions: see AGENTS.md (canonical governance document — applies identically to OpenSpec workflows and ordinary sessions).

rules:
  proposal:
    - "Follow AGENTS.md's OpenSpec Feature Lifecycle branch/commit invariants (sync main, branch feat/<change-name>, before any other action)"
    - "Always include Why, What Changes, Capabilities, and Impact sections"
    - "Adhere to the zero external dependency principle for the production binary and served frontend; development/test tooling may declare dependencies scoped to tooling only"
  specs:
    - "Use strict WHEN / THEN acceptance scenarios"
    - "Address cross-platform (Linux and Windows) behavior"
  design:
    - "Include package architecture and dependency decisions"
    - "Define TDD test execution sequence prior to implementation logic"
    - "Follow AGENTS.md's AI Agent governance and loop limits"
  tasks:
    - "Structure tasks into TDD Red phase, Green implementation phase, and verification phase"
    - "Group tasks into atomic, verifiable steps"

operations:
  apply:
    guidance:
      - "Strictly adhere to TDD: verify test failure (RED) before implementing code (GREEN)"
      - "Ensure all unit tests are 100% mocked with zero external integration or network access"
      - "Enforce host security: operate strictly within workspace root and avoid unverified external commands"
      - "Never exceed 3 iteration loops on a failing test without user escalation"
      - "Run targeted tests to optimize execution time and token usage"
      - "Mark tasks complete immediately in tasks.md upon verification"
      - "APPLY BOUNDARY: Upon completing all tasks, commit code and instruct user to run /opsx-archive. NEVER auto-archive or prompt for PR/merge during apply."
  archive:
    guidance:
      - "Verify all tests pass (go test ./...) and binaries build before archiving"
      - "Summarize changes and spec synchronization outcome"
      - "MANDATORY ARCHIVE COMMIT: Stage and commit all archive folder moves and synced specs directly to feat/<nome_spec> before pushing or opening a PR"
      - "MANDATORY PR/MERGE PROMPT: ONLY after archive execution, spec synchronization, and git commit on feat/<nome_spec> are complete, request user confirmation to choose between squash merge into main or GitHub PR"
      - "POST-PR INVARIANT: Upon PR creation and checkout back to main, NEVER make further commits on the branch, and ABSOLUTELY NEVER commit directly to main. All git updates must happen in the archive command."
