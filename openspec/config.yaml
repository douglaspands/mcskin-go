schema: spec-driven

context: |
  Project: mcskin (Minecraft Bedrock Skin Pack Converter)
  Language & Toolchain: Go 1.25+, standard library only (image/png, archive/zip, crypto/rand, encoding/json, path/filepath). Zero third-party runtime dependencies.
  Platform Compatibility: Cross-platform (Linux and Windows amd64). Use filepath.ToSlash() for zip entries.
  Methodology: Test-Driven Development (TDD). Pure unit tests MUST be 100% mocked with zero external integration (use io.Reader, bytes.Buffer, in-memory structs; no network, persistent disk, or OS process calls). Integration tests must be explicitly segregated. Tests MUST be verified RED before implementation code is written (GREEN phase).
  Domain & Standards:
    - Minecraft Bedrock .mcpack format: zip archive containing manifest.json (format_version: 2, RFC-4122 UUIDv4 header & module), skins.json, texts/en_US.lang, and texture.png.
    - Skin models: classic (geometry.humanoid.custom, 4px arms) and slim (geometry.humanoid.customSlim, 3px arms).
    - Image validation: 64x64 or 128x128 RGBA PNG only.
    - Output location: Exact same directory as input PNG with matching basename and .mcpack extension.
  AI Agent Governance & Host Security:
    - State Graph: [Plan/OpenSpec] -> [TDD: Write Tests (Red)] -> [Implement (Green)] -> [Verify & Lint] -> [Commit].
    - Loop Engineering: Max 3 repair attempts per failing test. Halt on repeated identical errors.
    - Host Security: Strict workspace containment. Zero sudo or privilege escalation. Air-gapped offline test execution. Synchronous commands bounded by 30s timeouts.
    - Token Optimization & Born Modularized ("Nascem Otimizadas"): All new and refactored source files in `cmd/`, `internal/`, and `internal/web/static/js/` SHALL NOT exceed 300 lines or 15 KB. Third-party vendor libraries MUST be isolated in `internal/web/static/vendor/` and excluded from AI context reads. Compact test runner `./scripts/test-compact.sh` is silent on PASS. Offload research, verbose test repair loops, and code investigations to subagents.
    - Autonomy: Autonomous execution for local read, test, build, and git commit. Permission required for destructive commands.
  Git Conventions:
    - Branching Strategy: The VERY FIRST action upon triggering `/opsx-propose` MUST be creating the branch `feat/<nome_spec>` (`git checkout -b feat/<nome_spec>`) to ensure safe rollback isolation.
    - Merging Strategy: After `/opsx-archive` completes all change archiving and spec synchronization, request user confirmation to merge `feat/<nome_spec>` into `main` using the squash method (`git merge --squash`).
    - Commits: Conventional Commits format (feat, fix, test, refactor, docs, chore).

rules:
  proposal:
    - "The very first action upon initiating a proposal MUST be creating the branch 'feat/<change-name>' for rollback isolation"
    - "Always include Why, What Changes, Capabilities, and Impact sections"
    - "Adhere to the zero external dependency principle"
  specs:
    - "Use strict WHEN / THEN acceptance scenarios"
    - "Address cross-platform (Linux and Windows) behavior"
  design:
    - "Include package architecture and dependency decisions"
    - "Define TDD test execution sequence prior to implementation logic"
    - "Define AI Agent governance and loop limits"
  tasks:
    - "Structure tasks into TDD Red phase, Green implementation phase, and verification phase"
    - "Group tasks into atomic, verifiable steps"

operations:
  apply:
    guidance:
      - "Strictly adhere to TDD: verify test failure (RED) before implementing code (GREEN)"
      - "Ensure all unit tests are 100% mocked with zero external integration or network access"
      - "Enforce host security: operate strictly within workspace root and avoid unverified external commands"
      - "Never exceed 3 iteration loops on a failing test without user escalation"
      - "Run targeted tests to optimize execution time and token usage"
      - "Mark tasks complete immediately in tasks.md upon verification"
      - "AUTOMATIC DIRECTIVE: Automatically execute feature-qa-reviewer immediately upon completing all tasks"
      - "LOOP ENGINEERING: In case of defects, use bounded loop remediation (max 3 attempts, halt on 2 identical errors, no infinite loops)"
      - "APPLY BOUNDARY: Upon PO/QA approval, commit code and instruct user to run /opsx-archive. NEVER auto-archive or prompt for PR/merge during apply."
  archive:
    guidance:
      - "Verify PO/QA review verdict is APROVADO before archiving"
      - "Verify all tests pass (go test ./...) and binaries build before archiving"
      - "Summarize changes and spec synchronization outcome"
      - "MANDATORY PR/MERGE PROMPT: ONLY after archive command execution and spec synchronization are complete, request user confirmation to choose between squash merge into main or GitHub PR"
